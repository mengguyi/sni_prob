name: Build and Release

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    # If it's a tag push, wait for release creation. Otherwise (PR/push), just run.
    needs: create-release
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true

          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabi
            use_cross: true

          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            use_cross: true

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            use_cross: true

          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            use_cross: true

          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            use_cross: true

          - os: ubuntu-latest
            target: loongarch64-unknown-linux-musl
            use_cross: true

          - os: ubuntu-latest
            target: powerpc-unknown-linux-gnu
            use_cross: true

          - os: ubuntu-latest
            target: powerpc64-unknown-linux-gnu
            use_cross: true

          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            use_cross: true

          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-musl
            use_cross: true

          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            use_cross: true

          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            use_cross: true

          - os: ubuntu-latest
            target: x86_64-pc-solaris
            use_cross: true

          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            use_cross: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true

          - os: ubuntu-latest
            target: x86_64-unknown-netbsd
            use_cross: true

          - os: windows-latest
            target: aarch64-pc-windows-gnullvm
            use_cross: true

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross: false

          - os: windows-latest
            target: i686-pc-windows-gnu
            use_cross: false

          - os: windows-latest
            target: i686-pc-windows-msvc
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-gnu
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      # Ensure 32-bit MinGW toolchain is available for i686-pc-windows-gnu builds
      - name: Install MinGW-w64 (i686)
        if: matrix.target == 'i686-pc-windows-gnu'
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x86

      - name: Configure MinGW-w64 (i686)
        if: matrix.target == 'i686-pc-windows-gnu'
        shell: bash
        run: |
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
          echo "AR=ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_I686_PC_WINDOWS_GNU_AR=ar" >> "$GITHUB_ENV"

      - name: Verify MinGW-w64 (i686)
        if: matrix.target == 'i686-pc-windows-gnu'
        run: |
          where i686-w64-mingw32-gcc
          i686-w64-mingw32-gcc --version

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # For non-release builds (PRs, pushes), build and upload artifacts
      - name: Build (native)
        if: matrix.use_cross == false && !startsWith(github.ref, 'refs/tags/v')
        run: cargo build --verbose --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross == true && !startsWith(github.ref, 'refs/tags/v')
        run: cross build --verbose --release --target ${{ matrix.target }}

      - name: Upload Build Artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v6
        with:
          name: sni_prob-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/sni_prob
            target/${{ matrix.target }}/release/sni_prob.exe
          if-no-files-found: ignore

      # For release builds (tags), use taiki-e/upload-rust-binary-action
      # This action handles building (using cross if needed), packaging (zip/tar.gz), and uploading.
      - name: Upload Binary (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sni_prob
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Note: This action automatically uses 'cross' if it detects it's needed or installed.

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings
